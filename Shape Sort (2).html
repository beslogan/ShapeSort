<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>2D and 3D Shape Sort</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --blue:#4D96FF;
  --purple:#C77DFF;
  --green:#6BCB77;
  --orange:#FF9F43;
  --pink:#FF6B9D;
  --yellow:#FFD93D;
  --red:#FF6B6B;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Baloo 2',cursive;
  background:linear-gradient(180deg,#9ad8ff 0%, #d8f3ff 45%, #d8ffd6 100%);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* BACKGROUND */

.cloud{
  position:absolute;
  background:white;
  border-radius:50px;
  opacity:.85;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.c1{
  width:140px;
  height:45px;
  top:50px;
  left:8%;
}

.c1:before{
  width:70px;
  height:70px;
  top:-30px;
  left:15px;
}

.c1:after{
  width:55px;
  height:55px;
  top:-20px;
  left:65px;
}

.c2{
  width:110px;
  height:35px;
  top:110px;
  right:10%;
}

.c2:before{
  width:55px;
  height:55px;
  top:-25px;
  left:12px;
}

.c2:after{
  width:40px;
  height:40px;
  top:-15px;
  left:50px;
}

.sun{
  position:absolute;
  top:25px;
  right:35px;
  width:80px;
  height:80px;
  background:var(--yellow);
  border-radius:50%;
  box-shadow:0 0 35px rgba(255,217,61,.7);
}

.grass{
  position:absolute;
  bottom:0;
  width:100%;
  height:70px;
  background:var(--green);
  border-radius:40% 40% 0 0;
}

/* CARD */

#game-card{
  width:95%;
  max-width:1200px;
  margin:30px auto;
  background:white;
  border-radius:30px;
  padding:25px;
  box-shadow:0 12px 40px rgba(0,0,0,.15);
  position:relative;
  z-index:5;
}

h1{
  margin:0;
  text-align:center;
  font-size:3rem;
  color:#2d3a5a;
}

.subtitle{
  text-align:center;
  color:#6d7d99;
  font-size:1.2rem;
  margin-bottom:20px;
}

#progress-wrap{
  width:100%;
  height:18px;
  background:#e8f1ff;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

#progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  transition:.3s;
}

/* SHAPE BANK */

#shape-bank{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:16px;
  margin-bottom:30px;
  min-height:180px;
}

.shape{
  width:100px;
  height:100px;
  background:#f7fbff;
  border-radius:20px;
  border:4px dashed var(--blue);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:grab;
  transition:.2s;
}

.shape:hover{
  transform:scale(1.08);
}

.shape.dragging{
  opacity:.5;
}

/* SORT AREAS */

#sort-area{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.drop-zone{
  border-radius:30px;
  padding:20px;
  color:white;
  min-height:350px;
  transition:.2s;
}

.drop-zone.active{
  transform:scale(1.02);
}

.drop-zone:nth-child(1){
  background:linear-gradient(135deg,#4D96FF,#3a72cc);
}

.drop-zone:nth-child(2){
  background:linear-gradient(135deg,#FF9F43,#d77a21);
}

.drop-zone h2{
  text-align:center;
  font-size:2.5rem;
  margin-top:0;
}

.zone-shapes{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  min-height:200px;
}

/* FEEDBACK */

#feedback{
  margin-top:20px;
  text-align:center;
  font-size:1.6rem;
  font-weight:800;
  min-height:40px;
}

.correct{
  color:var(--green);
}

.wrong{
  color:var(--red);
}

/* END SCREEN */

#complete-screen{
  display:none;
  text-align:center;
  padding:30px;
}

#complete-screen h2{
  font-size:3rem;
  color:#2d3a5a;
}

#final-score{
  font-size:4rem;
  color:var(--blue);
  font-weight:800;
}

#play-again{
  margin-top:20px;
  border:none;
  border-radius:30px;
  padding:16px 42px;
  background:linear-gradient(135deg,var(--orange),var(--pink));
  color:white;
  font-size:1.4rem;
  font-family:'Baloo 2',cursive;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.18);
}

svg{
  overflow:visible;
}

@media(max-width:700px){

  #sort-area{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="sun"></div>
<div class="grass"></div>

<div id="game-card">

  <div id="game-screen">

    <h1>🔷 2D or 3D Shape Sort!</h1>

    <div class="subtitle">
      Drag each shape into the correct group!
    </div>

    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>

    <div id="shape-bank"></div>

    <div id="sort-area">

      <div class="drop-zone" data-type="2d">

        <h2>🟦 2D Shapes</h2>

        <div class="zone-shapes"></div>

      </div>

      <div class="drop-zone" data-type="3d">

        <h2>🧊 3D Shapes</h2>

        <div class="zone-shapes"></div>

      </div>

    </div>

    <div id="feedback"></div>

  </div>

  <div id="complete-screen">

    <h2>🎉 Great Job!</h2>

    <div id="final-score"></div>

    <p id="message"></p>

    <button id="play-again">
      Play Again!
    </button>

  </div>

</div>

<script>

const TOTAL_SHAPES = 20;

const SHAPES = [

  /* 2D */

  {
    type:"2d",
    name:"Triangle",
    svg:`
    <polygon points="45,10 80,75 10,75"/>
    `
  },

  {
    type:"2d",
    name:"Square",
    svg:`
    <rect x="15" y="15" width="55" height="55" rx="5"/>
    `
  },

  {
    type:"2d",
    name:"Rectangle",
    svg:`
    <rect x="8" y="22" width="70" height="40" rx="5"/>
    `
  },

  {
    type:"2d",
    name:"Pentagon",
    svg:`
    <polygon points="45,8 80,35 65,78 25,78 10,35"/>
    `
  },

  {
    type:"2d",
    name:"Hexagon",
    svg:`
    <polygon points="25,8 65,8 85,45 65,82 25,82 5,45"/>
    `
  },

  {
    type:"2d",
    name:"Circle",
    svg:`
    <circle cx="45" cy="45" r="30"/>
    `
  },

  /* 3D */

  {
    type:"3d",
    name:"Cube",
    svg:`
    <polygon points="25,20 55,20 70,35 40,35" opacity=".7"/>
    <polygon points="25,20 25,55 40,70 40,35"/>
    <polygon points="40,35 70,35 70,70 40,70"/>
    `
  },

  {
    type:"3d",
    name:"Cone",
    svg:`
    <ellipse cx="45" cy="68" rx="28" ry="10"/>
    <polygon points="45,10 18,65 72,65"/>
    `
  },

  {
    type:"3d",
    name:"Cylinder",
    svg:`
    <ellipse cx="45" cy="18" rx="24" ry="10"/>
    <rect x="21" y="18" width="48" height="45"/>
    <ellipse cx="45" cy="63" rx="24" ry="10"/>
    `
  },

  {
    type:"3d",
    name:"Sphere",
    svg:`
    <circle cx="45" cy="45" r="30"/>
    <path d="M20 45 Q45 20 70 45" fill="none" stroke="white" stroke-width="3"/>
    `
  },

  {
    type:"3d",
    name:"Rectangular Prism",
    svg:`
    <polygon points="18,22 55,22 72,38 35,38" opacity=".7"/>
    <polygon points="18,22 18,62 35,78 35,38"/>
    <polygon points="35,38 72,38 72,78 35,78"/>
    `
  },

  {
    type:"3d",
    name:"Pyramid",
    svg:`
    <polygon points="45,12 18,68 72,68"/>
    <line x1="45" y1="12" x2="45" y2="68" stroke="white" stroke-width="3"/>
    `
  }

];

let placed = 0;

const bank = document.getElementById("shape-bank");
const feedback = document.getElementById("feedback");
const progressBar = document.getElementById("progress-bar");

function randomColor(){

  const colors = [
    "#4D96FF",
    "#FF6B9D",
    "#6BCB77",
    "#FFD93D",
    "#FF9F43",
    "#C77DFF"
  ];

  return colors[
    Math.floor(Math.random()*colors.length)
  ];
}

function shuffle(array){

  return [...array].sort(()=>Math.random()-0.5);
}

function speak(text){

  speechSynthesis.cancel();

  const utter =
    new SpeechSynthesisUtterance(text);

  utter.rate = 0.9;
  utter.pitch = 1.1;

  speechSynthesis.speak(utter);
}

function createGame(){

  placed = 0;

  bank.innerHTML = "";

  progressBar.style.width = "0%";

  const gameShapes = [];

  for(let i=0;i<TOTAL_SHAPES;i++){

    gameShapes.push(
      SHAPES[
        Math.floor(Math.random()*SHAPES.length)
      ]
    );
  }

  shuffle(gameShapes).forEach(shape=>{

    const div =
      document.createElement("div");

    div.className = "shape";

    div.draggable = true;

    div.dataset.type = shape.type;

    div.dataset.name = shape.name;

    const color = randomColor();

    div.innerHTML = `
      <svg width="80" height="80" viewBox="0 0 90 90">
        <g
          fill="${color}"
          stroke="${color}"
          stroke-width="2"
        >
          ${shape.svg}
        </g>
      </svg>
    `;

    div.addEventListener("dragstart",()=>{

      div.classList.add("dragging");

    });

    div.addEventListener("dragend",()=>{

      div.classList.remove("dragging");

    });

    bank.appendChild(div);

  });

  document.querySelectorAll(".zone-shapes")
    .forEach(zone=>zone.innerHTML="");

  feedback.textContent = "";

  speak("Drag the shapes into the correct group");
}

createGame();

/* DROP ZONES */

document.querySelectorAll(".drop-zone")
.forEach(zone=>{

  zone.addEventListener("dragover",(e)=>{

    e.preventDefault();

    zone.classList.add("active");

  });

  zone.addEventListener("dragleave",()=>{

    zone.classList.remove("active");

  });

  zone.addEventListener("drop",(e)=>{

    e.preventDefault();

    zone.classList.remove("active");

    const dragged =
      document.querySelector(".dragging");

    if(!dragged) return;

    const correctType =
      dragged.dataset.type;

    const zoneType =
      zone.dataset.type;

    if(correctType === zoneType){

      zone.querySelector(".zone-shapes")
        .appendChild(dragged);

      dragged.draggable = false;

      placed++;

      progressBar.style.width =
        ((placed / TOTAL_SHAPES) * 100) + "%";

      feedback.textContent =
        "⭐ Great Job!";

      feedback.className = "correct";

      speak(
        "Great Job! " +
        dragged.dataset.name
      );

      if(placed === TOTAL_SHAPES){

        setTimeout(showComplete,700);
      }

    } else {

      feedback.textContent =
        "🙈 Try Again!";

      feedback.className = "wrong";

      speak("Try Again");
    }

  });

});

function showComplete(){

  document.getElementById(
    "game-screen"
  ).style.display = "none";

  document.getElementById(
    "complete-screen"
  ).style.display = "block";

  document.getElementById(
    "final-score"
  ).textContent =
    "20 / 20";

  document.getElementById(
    "message"
  ).textContent =
    "You sorted all the shapes!";

  speak(
    "Amazing work! You sorted all the shapes!"
  );
}

document.getElementById(
  "play-again"
).onclick = ()=>{

  document.getElementById(
    "game-screen"
  ).style.display = "block";

  document.getElementById(
    "complete-screen"
  ).style.display = "none";

  createGame();
};

</script>

</body>
</html>
